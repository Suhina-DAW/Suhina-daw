[package]
name = "loopwerk"
description = "Loopwerk, the desktop app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[[bin]]
name = "loopwerk"
path = "src/main.rs"

[dependencies]
# The main window's native handle, for plug-in editors to float above it.
raw-window-handle = "0.6"  # MIT OR Apache-2.0 OR Zlib
loopwerk-engine.workspace = true
loopwerk-session.workspace = true
loopwerk-media.workspace = true
loopwerk-output.workspace = true
loopwerk-ui.workspace = true
zip.workspace = true
eframe = { version = "0.36", features = ["glow", "persistence"] }  # MIT OR Apache-2.0

[lints]
workspace = true
