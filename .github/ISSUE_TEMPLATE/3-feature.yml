name: Feature request
description: Something Suhina should be able to do
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [ROADMAP](https://github.com/suhina-daw/suhina-daw/blob/main/ROADMAP.md) first; it may already be planned.
        Describe behaviour in your own words. Don't paste text, images, presets or files from another product:
        Suhina is built clean-room (see CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: What you want to do
      description: The task you are trying to get done, and why it matters to you.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How it could work
      description: Where in the program, which keys, commands or settings.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Arrangement and editing
        - Clip launcher
        - Mixer and routing
        - Built-in effects and instruments
        - Plug-in hosting
        - Browser and library
        - Audio and MIDI input and output
        - Recording
        - Importing and exporting files
        - CLI and MCP
        - User interface and settings
        - Something else
    validations:
      required: true
  - type: textarea
    id: criteria
    attributes:
      label: How we know it's done
      description: Observable results someone could test.
      placeholder: |
        - A clip can be duplicated with Ctrl+D
        - The copy is placed right after the original and can be undone in one step
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched the open issues and the ROADMAP for this.
          required: true
