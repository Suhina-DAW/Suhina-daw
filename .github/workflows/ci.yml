name: CI

# Changes that touch only documentation do not run the checks; no code reads these files.
on:
  push:
    branches: [main]
    paths-ignore: &docs
      - "docs/**"
      - "**/*.md"
      - "LICENSE"
      - "NOTICE"
  pull_request:
    paths-ignore: *docs

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  check:
    name: clippy and tests (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA headers (cpal)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # The corpus tests need Live Sets that are not in the repository, so the `corpus` feature
      # stays off here.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
