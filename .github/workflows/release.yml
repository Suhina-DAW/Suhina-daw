name: Release

# Builds the release binaries. A `v*` tag builds them and attaches them to a draft GitHub Release:
# `v0.1.0-rc.1` for a release candidate, `v0.1.0` for the release. Running the workflow by hand only
# builds them, as workflow artifacts. See docs/releasing.md.
# The binaries are not signed yet (ROADMAP, M8): macOS Gatekeeper and Windows SmartScreen warn
# about them.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  BIN: loopwerk-cli
  # The process plug-ins run in (ADR 0006); loopwerk-cli looks for it next to itself.
  HOST: loopwerk-plugin-host

jobs:
  version:
    name: version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Read the version and check the tag
        id: version
        shell: bash
        run: |
          version=$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "loopwerk-cli") | .version')
          if [ -z "$version" ]; then
            echo "::error::could not read the loopwerk-cli version"
            exit 1
          fi
          # MAJOR.MINOR.PATCH, optionally with a release-candidate suffix: 0.1.0 or 0.1.0-rc.1.
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-rc\.[1-9][0-9]*)?$ ]]; then
            echo "::error::version $version is not MAJOR.MINOR.PATCH or MAJOR.MINOR.PATCH-rc.N"
            exit 1
          fi
          if [ "$GITHUB_REF_TYPE" = "tag" ] && [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match the workspace version $version"
            exit 1
          fi
          # Release candidates and everything before 1.0 are pre-releases.
          if [[ "$version" == *-rc.* || "$version" == 0.* ]]; then prerelease=true; else prerelease=false; fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.name }})
    needs: version
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest supported Ubuntu runner, so the binary runs on older glibc versions too.
          - name: linux-x86_64
            os: ubuntu-22.04
            targets: x86_64-unknown-linux-gnu
          - name: windows-x86_64
            os: windows-latest
            targets: x86_64-pc-windows-msvc
          # Both architectures, joined into one universal binary with lipo.
          - name: macos-universal
            os: macos-latest
            targets: aarch64-apple-darwin,x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    env:
      VERSION: ${{ needs.version.outputs.version }}
      PACKAGE: loopwerk-${{ needs.version.outputs.version }}-${{ matrix.name }}
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v4
      - name: Install ALSA headers (cpal)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: release-${{ matrix.name }}

      - name: Build
        shell: bash
        env:
          # Link the C runtime statically, so the Windows binary does not need the Visual C++
          # redistributable.
          RUSTFLAGS: ${{ runner.os == 'Windows' && '-C target-feature=+crt-static' || '' }}
          TARGETS: ${{ matrix.targets }}
        run: |
          for target in ${TARGETS//,/ }; do
            cargo build --release --locked -p loopwerk-cli -p loopwerk-plugin-host --target "$target"
          done
      - name: Collect the package
        shell: bash
        run: |
          mkdir -p "dist/$PACKAGE"
          case "$RUNNER_OS" in
            Windows)
              for bin in "$BIN" "$HOST"; do
                cp "target/x86_64-pc-windows-msvc/release/$bin.exe" "dist/$PACKAGE/"
              done ;;
            macOS)
              for bin in "$BIN" "$HOST"; do
                lipo -create -output "dist/$PACKAGE/$bin" \
                  "target/aarch64-apple-darwin/release/$bin" \
                  "target/x86_64-apple-darwin/release/$bin"
                lipo -info "dist/$PACKAGE/$bin"
              done ;;
            *)
              for bin in "$BIN" "$HOST"; do
                cp "target/x86_64-unknown-linux-gnu/release/$bin" "dist/$PACKAGE/"
              done ;;
          esac
          cp LICENSE NOTICE README.md ATTRIBUTION.md "dist/$PACKAGE/"

      - name: Smoke test
        shell: bash
        run: |
          exe="dist/$PACKAGE/$BIN"
          host="dist/$PACKAGE/$HOST"
          if [ "$RUNNER_OS" = "Windows" ]; then exe="$exe.exe"; host="$host.exe"; fi
          output=$("$exe" --version)
          echo "$output"
          if [ "$output" != "$BIN $VERSION" ]; then
            echo "::error::expected '$BIN $VERSION', got '$output'"
            exit 1
          fi
          # A plug-in through the plug-in host found next to the CLI: the VST3 gain built into
          # the host, on a tenth of a second of silence.
          "$exe" plugin run test:vst3 - smoke.wav --seconds 0.1 --tail 0
          test -s smoke.wav
          for binary in "$exe" "$host"; do
            case "$RUNNER_OS" in
              Linux)
                # Only system libraries: libasound is the one a user may have to install.
                ldd "$binary"
                if ldd "$binary" | grep -q "not found"; then exit 1; fi ;;
              macOS)
                otool -L "$binary"
                lipo "$binary" -verify_arch arm64 x86_64 ;;
              Windows)
                # No dependency on the Visual C++ runtime: its DLL names would be in the import
                # table.
                if grep -qaiE "vcruntime140|msvcp140" "$binary"; then
                  echo "::error::$binary needs the Visual C++ runtime"
                  exit 1
                fi ;;
            esac
          done

      - name: Archive
        shell: bash
        run: |
          cd dist
          if [ "$RUNNER_OS" = "Windows" ]; then
            7z a -tzip "$PACKAGE.zip" "$PACKAGE" > /dev/null
            archive="$PACKAGE.zip"
          else
            tar -czf "$PACKAGE.tar.gz" "$PACKAGE"
            archive="$PACKAGE.tar.gz"
          fi
          if command -v sha256sum > /dev/null; then
            sha256sum "$archive" > "$archive.sha256"
          else
            shasum -a 256 "$archive" > "$archive.sha256"
          fi
          cat "$archive.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.PACKAGE }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error

  release:
    name: draft release
    needs: [version, build]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
          PRERELEASE: ${{ needs.version.outputs.prerelease }}
        run: |
          ls -l dist
          flags=()
          # A pre-release never becomes the "latest" release on the repository page.
          if [ "$PRERELEASE" = "true" ]; then flags+=(--prerelease --latest=false); fi
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --draft \
            "${flags[@]}" \
            --title "Loopwerk $VERSION" \
            --notes "Pre-alpha build of the headless command-line tool (\`$BIN\`). The binaries are not signed."
