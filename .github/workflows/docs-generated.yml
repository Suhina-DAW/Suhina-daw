name: Generated docs

# Regenerates docs/INDEX.md (from the documents' front matter), docs/commands.md (from the
# command registry) and the parity figures (from scripts/parity/) on main after every merge, and
# commits them when they changed. Pull requests leave all of them alone, so two pull requests never
# conflict on them.
#
# The parity *report* is not here: it is a normal document whose marked parts are written by
# scripts/parity/update_report.py and kept current by a check in ci.yml, so a pull request that
# changes the numbers updates it in the same pull request. Only the figures, binary files that
# would differ between matplotlib versions on contributors' machines, are rendered here.
#
# None of it needs a copy of the manual: the numbers it was read for are recorded in
# scripts/parity/score.py. See docs/research/parity-live-12.md › Reproducing.
#
# Two jobs, so the key that may push to main never shares a machine with code from the repository
# or its dependencies (build scripts, proc macros): `generate` builds and writes the files with no
# secrets; `publish` runs only git, copies exactly those files and pushes them.
#
# The push uses a deploy key that the main ruleset lets bypass pull requests. Setup:
# `ssh-keygen -t ed25519 -N "" -f docs-bot`; add docs-bot.pub under Settings › Deploy keys with
# write access; create the environment `docs-bot` (Settings › Environments) limited to the `main`
# branch, with docs-bot as its secret DOCS_DEPLOY_KEY; add "Deploy keys" to the bypass list of the
# main ruleset. Without the secret the files are generated but not pushed.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, in order; a run that finds main moved on leaves the work to the newer run.
concurrency:
  group: docs-generated
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install ALSA headers (cpal)
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: docs/commands.md
        run: cargo run --quiet -p suhina-cli -- commands --markdown > docs/commands.md
      - name: docs/INDEX.md
        run: python3 scripts/docs.py index --write
      # The parity figures: pure Python over the recorded numbers, so they cannot drift from the
      # numbers the report's marked parts are rendered from.
      - name: Parity figures
        run: |
          # Pinned so the figures are byte-for-byte the same between runs; a newer matplotlib draws
          # slightly different pixels, and an unpinned one would make the bot commit new PNGs for
          # nothing. Raise it on purpose, in a pull request of its own.
          python3 -m pip install --quiet --disable-pip-version-check matplotlib==3.10.9
          python3 scripts/parity/charts.py
      - uses: actions/upload-artifact@v4
        with:
          name: generated-docs
          path: |
            docs/INDEX.md
            docs/commands.md
            docs/research/parity-live-12-by-area.png
            docs/research/parity-live-12-overview.png
          retention-days: 1

  publish:
    needs: generate
    runs-on: ubuntu-latest
    environment: docs-bot
    steps:
      - uses: actions/checkout@v4
        with:
          ssh-key: ${{ secrets.DOCS_DEPLOY_KEY }}
      - uses: actions/download-artifact@v4
        with:
          name: generated-docs
          path: ${{ runner.temp }}/generated
      - name: Commit and push when they changed
        env:
          GENERATED: ${{ runner.temp }}/generated
          HAS_KEY: ${{ secrets.DOCS_DEPLOY_KEY != '' }}
        run: |
          for name in INDEX.md commands.md; do
            source="$GENERATED/$name"
            if [ ! -f "$source" ] || [ -L "$source" ]; then
              echo "::error::$name is missing from the generated files or is not a regular file."
              exit 1
            fi
            cp "$source" "docs/$name"
          done
          # upload-artifact keeps the path below the files' common root, which is docs/ here.
          for name in parity-live-12-by-area.png parity-live-12-overview.png; do
            source="$GENERATED/research/$name"
            if [ ! -f "$source" ] || [ -L "$source" ]; then
              echo "::error::research/$name is missing from the generated files or is not a regular file."
              exit 1
            fi
            cp "$source" "docs/research/$name"
          done
          changed=$(git status --porcelain)
          if [ -z "$changed" ]; then
            echo "Generated documentation is current."
            exit 0
          fi
          # Only modified (" M") or new ("??") files, never a deletion or a rename, and only the
          # files generated above.
          if printf '%s\n' "$changed" | grep -Ev '^( M|\?\?) docs/(INDEX|commands)\.md$|^( M|\?\?) docs/research/parity-live-12-(by-area|overview)\.png$'; then
            echo "::error::Only the generated docs and the parity figures may change (above: anything else)."
            exit 1
          fi
          git diff --stat
          if [ "$HAS_KEY" != "true" ]; then
            echo "::warning::DOCS_DEPLOY_KEY is not set in the docs-bot environment, so the files are not pushed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/INDEX.md docs/commands.md \
            docs/research/parity-live-12-by-area.png docs/research/parity-live-12-overview.png
          git commit -m "Docs: regenerate INDEX.md, commands.md and the parity figures"
          if ! git push origin HEAD:main; then
            echo "::notice::main moved on during this run; the run for the newer commit regenerates the files."
          fi
