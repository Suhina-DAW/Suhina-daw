[workspace]
resolver = "3"
members = ["crates/*", "devices/*", "apps/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.95"

[workspace.dependencies]
# internal
loopwerk-model = { path = "crates/model" }
loopwerk-engine = { path = "crates/engine" }
loopwerk-als = { path = "crates/als" }
loopwerk-session = { path = "crates/session" }
loopwerk-automation = { path = "crates/automation" }
loopwerk-media = { path = "crates/media" }
loopwerk-dsp = { path = "crates/dsp" }
loopwerk-device-api = { path = "crates/device-api" }
loopwerk-device-utility = { path = "devices/utility" }
loopwerk-device-auto-pan = { path = "devices/auto-pan" }

# external (licences must be GPLv3-compatible)
hound = "3.5"  # Apache-2.0
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }  # MIT OR Apache-2.0
roxmltree = "0.21"  # MIT OR Apache-2.0
cpal = "0.18"  # Apache-2.0
serde_json = "1"  # MIT OR Apache-2.0
rtrb = "0.3"  # MIT OR Apache-2.0

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
unimplemented = "deny"
unreachable = "deny"

[profile.dev.package."*"]
opt-level = 2

[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
